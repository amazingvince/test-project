# Accelerate configuration for single GPU training
# Place in: ~/.cache/huggingface/accelerate/default_config.yaml
# Or use with: accelerate launch --config_file configs/accelerate.yaml train.py

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: 'NO'
downcast_bf16: 'no'
enable_cpu_affinity: true
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

# GPU settings
gpu_ids: '0'

# Dynamo settings (torch.compile)
dynamo_backend: 'NO'

# For memory efficiency
# deepspeed_config: null
# fsdp_config: null
