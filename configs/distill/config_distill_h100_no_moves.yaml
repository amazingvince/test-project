# Chess LLM Policy Distillation (H100, no 8k move tokens)
# ======================================================
#
# This configuration avoids adding the 8,064 UCI move tokens to the tokenizer.
# Instead, it uses a token-by-token distillation loss over the move string
# after `<uci_move>` (see `distillation.move_distill_mode: move_prefix`).

model:
  name: "Qwen/Qwen3-4B-Thinking-2507"
  max_seq_length: 2048
  attn_implementation: "flash_attention_2"
  torch_dtype: "bfloat16"

# Tokenizer augmentation
tokenizer:
  # Do NOT add the 8k move vocab.
  chess_mode: "tags_only"
  # Keep think tags as special tokens so truncation/budgeting is more stable.
  add_think_tags: true

training:
  output_dir: "./outputs/chess-distill-h100-no-moves"

  # Batch settings
  per_device_train_batch_size: 48
  per_device_eval_batch_size: 48
  gradient_accumulation_steps: 1

  # Training duration
  num_train_epochs: 1
  max_steps: -1

  # Learning rate
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1

  # Optimizer
  optim: "adamw_torch_fused"
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Performance optimizations
  torch_compile: false

  # Collation
  use_unpad: true
  pad_to_multiple_of: 8
  return_flash_attn_kwargs: true

  # Logging
  logging_steps: 10
  report_to: "wandb"
  run_name: "chess-policy-distill-h100-no-moves"

  # Chess eval generation
  chess_eval_max_new_tokens: 1024
  chess_eval_max_total_tokens: 2048
  chess_eval_do_sample: true
  chess_eval_temperature: 0.6
  chess_eval_top_p: 0.95
  chess_eval_top_k: 20
  chess_eval_min_p: 0.0
  chess_eval_print_samples: 3
  chess_eval_print_max_chars: 2000

  # Saving
  save_steps: 500
  save_total_limit: 3

  # Evaluation
  eval_strategy: "steps"
  eval_steps: 500
  eval_size: 200

  # Fast chess eval callback (separate from eval_loss)
  chess_eval_positions: 150
  chess_eval_batch_size: 32
  chess_eval_steps: 500

  # Optimizations
  bf16: true
  tf32: true
  gradient_checkpointing: true

stockfish:
  path: "/usr/bin/stockfish"
  num_workers: 24
  threads_per_worker: 1
  depth: 12
  time_limit_ms: null
  nodes: null
  top_k: 5
  shallow_depth: 4
  shallow_max_moves: 64
  confirm_depth: 14
  confirm_top_k: 2
  hash_mb_per_worker: 64
  prob_mode: "cp"
  wdl_temperature: 1.0
  cache_size: 8192
  source_overrides:
    game:
      depth: 10
      top_k: 5
    puzzle:
      depth: 12
      top_k: 8

distillation:
  # No move-token vocab -> use prefix distillation.
  move_distill_mode: "move_prefix"

  ce_loss_enabled: true
  kl_weight: 1.0
  temperature: 1.0
  min_probability: 0.001
  add_uci_move_tokens: false
  log_tokenizer_stats: false
  stockfish_temperature: 100.0
  use_liger: true
  loss_type: "kl"

cce:
  enabled: true

formatting:
  max_display_moves: 5
  include_board: false
  randomize_order: true
  include_target_if_missing: true
  pv_length: 5

reasoning_trace:
  enabled: true
  always_choose_best_move: true
  max_trace_tokens: 1024
  move_notation: "uci"
  min_candidates: 3
  max_candidates: 5
  candidate_order: "shuffled"
  include_opening: true
  include_tablebase: true
  include_orientation: true
  include_assessment: true
  include_comparison: true
  include_reconsideration: true
  include_dead_end: true
  include_pv: true
  max_pv_length: 8
  include_threat_scan: true
  threat_max_checks: 2
  threat_max_hanging: 2
  threat_scan_include_empty: false
  include_plan: true
  plan_prob: 0.5
  include_opponent_perspective: true
  opponent_perspective_prob: 0.4
  unclear_win_margin: 0.04
  include_motifs: true
  include_quiet_move_motif: true
  perpetual_max_plies: 6
  max_motifs_per_candidate: 1
  include_candidate_pv: true
  candidate_pv_prob: 0.6
  candidate_pv_max_len: 4
  candidate_question_prob: 0.35
  include_static_eval_notes: true
  static_eval_prob: 0.4
  max_static_eval_notes: 2
  static_eval_include_material: true
  static_eval_include_pawn_structure: true
  static_eval_include_king_safety: true
  static_eval_include_development: true
  static_eval_include_mobility: true
  mobility_note_threshold: 8
  include_positional_cues: true
  max_positional_cues: 4
  pv_prune_quiet: true
  pv_prune_quiet_plies: 2
  pv_prune_min_moves: 2
  pv_quiet_summary: true
  trap_detection_enabled: true
  trap_shallow_depth: 4
  trap_confirm_depth: 14
  trap_candidate_limit: 5
  trap_min_win_prob_swing: 0.12
  trap_shallow_good_win_prob: 0.06
  trap_shallow_bad_win_prob: 0.18
  trap_confirm_top_k: 2
  trap_confirm_win_prob_tolerance: 0.05
  phrase_variation_enabled: true
  orientation_starter_prob: 0.25
  reconsideration_prob: 0.4
  dead_end_prob: 0.4
  comparison_prob: 0.5
  style_weights:
    thorough: 0.40
    concise: 0.15
    tactical: 0.10
    quick: 0.10
    problem_focused: 0.10
    intuition: 0.08
    comparison_focused: 0.07

